name: didit_sdk_core
description: Didit Identity Verification SDK for Flutter, pinned to the core native SDK variant (smallest, manual capture only - no automatic capture, no NFC). Same Dart API as didit_sdk - depend on exactly one of the didit_sdk packages. Generated from didit_sdk - do not edit by hand.
version: 4.4.0
homepage: https://didit.me
repository: https://github.com/didit-protocol/sdk-flutter
issue_tracker: https://github.com/didit-protocol/sdk-flutter/issues

environment:
  sdk: ^3.11.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: me.didit.sdk.sdk_flutter
        pluginClass: SdkFlutterPlugin
      ios:
        pluginClass: SdkFlutterPlugin
