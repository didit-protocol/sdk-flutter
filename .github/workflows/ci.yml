name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze and test (root, variants, example)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze and test root package
        run: |
          flutter pub get
          flutter analyze
          flutter test -r expanded

      # Variant packages are generated copies (tool/generate_variant_packages.sh)
      # with per-variant native pins; each must still resolve and analyze clean
      # on its own, exactly as pub.dev consumers see it.
      - name: Analyze variant packages and example
        run: |
          for pkg in packages/didit_sdk_core packages/didit_sdk_autodetection packages/didit_sdk_nfc example; do
            echo "::group::$pkg"
            (cd "$pkg" && flutter pub get && flutter analyze)
            echo "::endgroup::"
          done

  auth-package:
    name: Analyze, format and test (didit_auth)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/didit_auth
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # didit_auth is its own package (own version, own tag), not a generated
      # variant of didit_sdk.
      - name: Resolve, format, analyze and test
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test -r expanded

  variant-drift:
    name: Variant packages match the generator
    # macos: generate_variant_packages.sh uses BSD sed (sed -i '').
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The variants must never drift from the canonical root package: a
      # hand-edit that skips the generator (or a root change that forgets to
      # regenerate) publishes diverging Dart/native code to pub.dev.
      - name: Regenerate variants and require a clean tree
        run: |
          ./tool/generate_variant_packages.sh
          # Only the generated variants: packages/didit_auth is hand-written.
          git add -N packages/didit_sdk_core packages/didit_sdk_autodetection packages/didit_sdk_nfc
          git diff --exit-code -- packages/didit_sdk_core packages/didit_sdk_autodetection packages/didit_sdk_nfc

  build-android-example:
    name: Example app builds (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Resolves the released didit-sdk Android artifacts and packages a debug
      # APK - the consumer-side tripwire for broken/missing AARs.
      - name: Build example APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug

      # The example's MainActivity is Kotlin. A build that skipped Kotlin
      # compilation still packages an APK, so check the class is in it.
      - name: Example APK contains the Kotlin MainActivity
        working-directory: example
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          if ! unzip -p "$apk" 'classes*.dex' | grep -aq 'Lme/didit/sdk/sdk_flutter_example/MainActivity;'; then
            echo "::error::$apk has no MainActivity class: the example's Kotlin sources were not compiled"
            exit 1
          fi

      # The plugin's JVM unit tests (android/src/test) against the released
      # native AAR, inside the Gradle project the build above generated.
      - name: Plugin unit tests (Android)
        working-directory: example/android
        run: ./gradlew :didit_sdk:testDebugUnitTest

  build-android-example-agp9:
    name: Example app builds (Android, AGP 9 built-in Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The example stays on AGP 8 in the repository (the job above); this run
      # moves it to AGP 9 with built-in Kotlin, which refuses any project that
      # also applies the Kotlin Gradle Plugin (KGP). Setting the flag explicitly
      # also stops Flutter from writing android.builtInKotlin=false.
      - name: Move the example to AGP 9 with built-in Kotlin
        working-directory: example/android
        run: |
          sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "9.2.1"/' settings.gradle.kts
          sed -i 's/gradle-[0-9.]*-all\.zip/gradle-9.5.1-all.zip/' gradle/wrapper/gradle-wrapper.properties
          printf '\nandroid.builtInKotlin=true\nandroid.newDsl=false\n' >> gradle.properties
          grep -q 'id("com.android.application") version "9.2.1"' settings.gradle.kts
          grep -q 'gradle-9.5.1-all.zip' gradle/wrapper/gradle-wrapper.properties

      - name: Build example APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug 2>&1 | tee "$RUNNER_TEMP/build-apk.log"

      # Built-in Kotlin must compile the example's Kotlin MainActivity too.
      - name: Example APK contains the Kotlin MainActivity
        working-directory: example
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          if ! unzip -p "$apk" 'classes*.dex' | grep -aq 'Lme/didit/sdk/sdk_flutter_example/MainActivity;'; then
            echo "::error::$apk has no MainActivity class: the example's Kotlin sources were not compiled"
            exit 1
          fi

      - name: Plugin unit tests (Android)
        working-directory: example/android
        run: ./gradlew :didit_sdk:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      # Flutter names every plugin that still applies KGP and will refuse to
      # build them in a future release.
      - name: No KGP warning names didit_sdk
        run: |
          if grep -h 'plugins that apply Kotlin Gradle Plugin (KGP):.*didit_sdk' "$RUNNER_TEMP/build-apk.log" "$RUNNER_TEMP/unit-tests.log"; then
            echo "::error::Flutter reports that didit_sdk applies the Kotlin Gradle Plugin on AGP 9"
            exit 1
          fi

  build-ios-example:
    name: Example app builds (iOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Compiles the plugin's `import DiditSDK` against the RELEASED iOS
      # binaries (CocoaPods path) - the tripwire that would have caught the
      # 4.7.0 .swiftinterface leak ("no such module 'TensorFlowLite'") before
      # it reached integrators. On a native-pin bump that lands before the
      # sdk-ios release assets exist, this fails by design; re-run once the
      # release is published.
      # Flutter's experimental Swift Package Manager integration cannot build
      # the in-repo example: the example consumes the plugin by path from a
      # checkout directory named sdk-flutter, and SPM rejects the identity
      # override ("identity 'sdk-flutter' doesn't match ... 'didit_sdk'").
      # pub.dev consumers are unaffected. Build through CocoaPods - the
      # mainstream consumer path, and the one that compiles the released
      # binaries' .swiftinterface.
      - name: Build example iOS app (no codesign)
        working-directory: example
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter build ios --debug --no-codesign

      # The plugin's XCTests (example/ios/RunnerTests) on a simulator, against
      # the same released native binaries.
      - name: Plugin unit tests (iOS)
        working-directory: example/ios
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c 'import json, sys; print(next(d["udid"] for runtime, devices in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner -configuration Debug -destination "id=$udid"

      # Dart to the released native SDK and back on a simulator: the native SDK
      # ends the flow through its own callback with retryBlocked, against a
      # stand-in for the verification API, and Dart checks the result.
      - name: Bridge test (iOS)
        run: bash tool/ios_bridge_test.sh

  # didit_auth has no example app of its own. These two jobs generate a throwaway
  # app that depends on the package by path, so the Kotlin and Swift plugin code
  # compiles against the RELEASED native DiditAuth binaries (Maven, CocoaPods)
  # on every pull request.
  auth-package-android:
    name: didit_auth builds in an app (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate an app that uses the package
        run: |
          flutter create --platforms=android --org com.example.authprobe "$RUNNER_TEMP/auth_probe"
          cd "$RUNNER_TEMP/auth_probe"
          flutter pub add didit_auth --path "$GITHUB_WORKSPACE/packages/didit_auth"

      - name: Build the app
        working-directory: ${{ runner.temp }}/auth_probe
        run: flutter build apk --debug

      - name: The plugin class is in the APK
        working-directory: ${{ runner.temp }}/auth_probe
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          unzip -p "$apk" 'classes*.dex' | grep -aq 'Lme/didit/auth/flutter/DiditAuthPlugin;'
          unzip -p "$apk" 'classes*.dex' | grep -aq 'Lme/didit/sdk/auth/DiditAuth;'

      - name: Plugin unit tests (Android)
        working-directory: ${{ runner.temp }}/auth_probe/android
        run: ./gradlew :didit_auth:testDebugUnitTest

  auth-package-ios:
    name: didit_auth builds in an app (iOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # CocoaPods path, as in the example app's job: the released binaries'
      # .swiftinterface is what the plugin's `import DiditAuth` compiles against.
      - name: Generate an app that uses the package
        run: |
          flutter config --no-enable-swift-package-manager
          flutter create --platforms=ios --org com.example.authprobe "$RUNNER_TEMP/auth_probe"
          cd "$RUNNER_TEMP/auth_probe"
          flutter pub add didit_auth --path "$GITHUB_WORKSPACE/packages/didit_auth"
          # DiditSDK is not on the CocoaPods trunk: the app names its podspec, as the README says.
          sed -i '' "s|^# platform :ios, .*|platform :ios, '15.0'|" ios/Podfile
          native=$(sed -n "s/.*didit_auth_native_version = '\(.*\)'/\1/p" "$GITHUB_WORKSPACE/packages/didit_auth/ios/didit_auth.podspec")
          perl -0pi -e "s|(  use_frameworks!\n)|\$1  pod 'DiditSDK/Auth', :podspec => 'https://raw.githubusercontent.com/didit-protocol/sdk-ios/$native/DiditSDK.podspec'\n|" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/' ios/Runner.xcodeproj/project.pbxproj
          grep -n "DiditSDK/Auth\|platform :ios" ios/Podfile

      - name: Build the app (no codesign)
        working-directory: ${{ runner.temp }}/auth_probe
        run: flutter build ios --debug --no-codesign
